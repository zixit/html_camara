<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro Laptops 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: sans-serif; }
    .btn-massive { padding: 15px; font-size: 1.2rem; border-radius: 10px; width: 100%; margin-bottom: 15px; font-weight: bold; }
    #loading-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
    }
    #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 15px; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="loading-overlay" class="d-none">
    <div class="spinner-border text-light" style="width:4rem;height:4rem;"></div>
    <h3 class="mt-3" id="loading-text">Procesando...</h3>
  </div>

  <div class="container py-4">
    <h2 class="text-center mb-4">Registro Laptops</h2>

    <!-- VISTA 1: ESCÁNER -->
    <div id="view-scanner">
      <div class="card shadow-sm border-0"><div class="card-body p-3 text-center">
        <div id="box-iniciar-camara" class="py-4">
          <button class="btn btn-primary btn-massive py-4 shadow" onclick="encenderCamara()">📷 Encender Cámara</button>
        </div>
        <div id="reader" class="d-none mb-3"></div>
        <button id="btn-detener-camara" class="btn btn-outline-danger btn-massive d-none" onclick="detenerCamara()">Detener Cámara</button>
      </div></div>
    </div>

    <!-- VISTA 2: ERROR -->
    <div id="view-error" class="d-none text-center mt-5">
      <h1 class="text-danger fw-bold mb-4">Docente no Beneficiado</h1>
      <button class="btn btn-primary btn-massive py-4 shadow" onclick="resetApp(true)">↻ Escanear Otro</button>
    </div>

    <!-- VISTA 3: ACCIONES -->
    <div id="view-actions" class="d-none">
      <div class="card shadow-sm border-success mb-4">
        <div class="card-body text-center bg-success text-white rounded">
          <h5 class="mb-1">Docente Beneficiado</h5>
          <h3 class="fw-bold mb-0" id="lbl-num-emp"></h3>
          <p class="mb-0 fs-5" id="lbl-nombre"></p>
        </div>
      </div>

      <div id="box-ingresar-serie">
        <button class="btn btn-warning btn-massive text-dark py-3 shadow" onclick="mostrarInputSerie()">✍️ 1. Ingresar Número de Serie</button>
      </div>
      <div id="box-serie-registrada" class="d-none alert alert-info text-center fs-5 border-info shadow-sm">
        <strong>Serie asignada:</strong> <span id="lbl-serie" class="fw-bold fs-4"></span>
      </div>
      <div id="box-input-serie" class="d-none card p-3 mb-3 border-warning shadow-sm">
        <label class="form-label fw-bold">Escribe la serie (exactamente 5 caracteres):</label>
        <input type="text" id="input-serie" class="form-control form-control-lg text-center text-uppercase fs-3" maxlength="5" placeholder="Ej: AB123">
        <button class="btn btn-success btn-massive mt-3 py-3" onclick="guardarSerie()">Guardar Serie</button>
        <button class="btn btn-outline-secondary w-100 py-2" onclick="cancelarSerie()">Cancelar</button>
      </div>

      <button class="btn btn-primary btn-massive py-3 shadow" onclick="document.getElementById('input-camera').click()">📸 2. Tomar Fotografía</button>
      <input type="file" id="input-camera" accept="image/*" capture="environment" class="d-none" onchange="procesarFoto(this)">
      <div id="alerta-foto-ok" class="d-none alert alert-success text-center fw-bold fs-5 shadow-sm">✅ Fotografía guardada</div>

      <hr>
      <button class="btn btn-dark btn-massive mt-4 py-4 shadow" onclick="resetApp(true)">⏭️ Finalizar y Siguiente</button>
    </div>
  </div>

  <script>
    const API_URL = 'PEGA_AQUI_LA_URL_EXEC_DE_APPS_SCRIPT';
    const TOKEN   = 'cambia-esto-por-una-clave-larga-123';

    let html5QrCode = null, currentFila = null, currentNumEmp = null, procesando = false;

    // Llamada al backend (texto plano = sin preflight CORS)
    async function api(action, datos) {
      const r = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ token: TOKEN, action: action }, datos))
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      return j;
    }

    const $ = id => document.getElementById(id);
    function showView(id) {
      ['view-scanner','view-error','view-actions'].forEach(v => $(v).classList.add('d-none'));
      $(id).classList.remove('d-none');
    }
    function showLoading(t) { $('loading-text').innerText = t; $('loading-overlay').classList.remove('d-none'); }
    function hideLoading() { $('loading-overlay').classList.add('d-none'); }

    function resetApp(autoIniciar) {
      currentFila = null; currentNumEmp = null; procesando = false;
      $('input-serie').value = '';
      $('box-input-serie').classList.add('d-none');
      $('box-ingresar-serie').classList.remove('d-none');
      $('box-serie-registrada').classList.add('d-none');
      $('alerta-foto-ok').classList.add('d-none');
      showView('view-scanner');
      detenerCamara();
      if (autoIniciar === true) encenderCamara(); // enciende sola tras el toque en "Siguiente"
    }

    // --- CÁMARA EN VIVO ---
    function encenderCamara() {
      $('box-iniciar-camara').classList.add('d-none');
      $('reader').classList.remove('d-none');
      $('btn-detener-camara').classList.remove('d-none');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader", {
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          verbose: false
        });
      }
      const config = {
        fps: 15,
        qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; }
      };
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, function(){})
        .catch(err => { alert("No se pudo abrir la cámara: " + err); detenerCamara(); });
    }

    function detenerCamara() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
      }
      $('box-iniciar-camara').classList.remove('d-none');
      $('reader').classList.add('d-none');
      $('btn-detener-camara').classList.add('d-none');
    }

    async function onScanSuccess(decodedText) {
      if (procesando) return;
      procesando = true;
      detenerCamara();
      showLoading("Buscando Docente...");
      try {
        const r = await api('buscar', { numEmp: decodedText });
        hideLoading();
        if (r.encontrado) {
          currentFila = r.fila; currentNumEmp = r.numEmp;
          $('lbl-num-emp').innerText = "Emp: " + r.numEmp;
          $('lbl-nombre').innerText = r.nombre;
          if (r.serie && r.serie.length > 0) {
            $('box-ingresar-serie').classList.add('d-none');
            $('box-serie-registrada').classList.remove('d-none');
            $('lbl-serie').innerText = r.serie;
          } else {
            $('box-ingresar-serie').classList.remove('d-none');
            $('box-serie-registrada').classList.add('d-none');
          }
          showView('view-actions');
        } else {
          showView('view-error');
        }
      } catch (e) {
        hideLoading(); alert("Error: " + e.message); resetApp();
      }
    }

    // --- SERIE ---
    function mostrarInputSerie() { $('box-ingresar-serie').classList.add('d-none'); $('box-input-serie').classList.remove('d-none'); }
    function cancelarSerie() { $('box-input-serie').classList.add('d-none'); $('box-ingresar-serie').classList.remove('d-none'); }

    async function guardarSerie() {
      const serie = $('input-serie').value.trim();
      if (serie.length !== 5) { alert("La serie DEBE tener 5 caracteres."); return; }
      showLoading("Guardando Serie...");
      try {
        await api('serie', { fila: currentFila, serie: serie });
        hideLoading();
        $('box-input-serie').classList.add('d-none');
        $('box-serie-registrada').classList.remove('d-none');
        $('lbl-serie').innerText = serie.toUpperCase();
      } catch (e) { hideLoading(); alert("Error: " + e.message); }
    }

    // --- FOTO DE EVIDENCIA ---
    function procesarFoto(input) {
      if (!input.files || !input.files[0]) return;
      showLoading("Subiendo foto...");
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          const MAX = 1000, scale = Math.min(1, MAX / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale; canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataURI = canvas.toDataURL("image/jpeg", 0.7);
          try {
            await api('foto', { numEmp: currentNumEmp, fila: currentFila, dataURI: dataURI });
            hideLoading();
            $('alerta-foto-ok').classList.remove('d-none');
            input.value = "";
          } catch (err) { hideLoading(); alert("Error: " + err.message); }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    window.onload = function() { resetApp(); };
  </script>
</body>
</html>
